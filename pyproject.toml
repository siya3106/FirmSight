[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firmsight"
version = "0.1.0"
description = "Automated IoT Firmware Dynamic Analysis and Emulation Platform with TUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
full = [
    "r2pipe>=1.9.0",
    "scapy>=2.5.0",
]

[project.scripts]
firmsight = "firmsight.cli:main"
